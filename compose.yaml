services:
  proxy:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9090:9090"
    environment:
      SWITCHYARD_ADMIN_TOKEN: ${SWITCHYARD_ADMIN_TOKEN:?Set a token of at least 16 characters}
    volumes:
      - ./config:/app/config:ro
    depends_on: [alpha, bravo, charlie]
    stop_grace_period: 10s
  alpha:
    build: .
    command: ["dev.switchyard.DemoBackend", "9001", "alpha", "0.0.0.0"]
  bravo:
    build: .
    command: ["dev.switchyard.DemoBackend", "9002", "bravo", "0.0.0.0"]
  charlie:
    build: .
    command: ["dev.switchyard.DemoBackend", "9003", "charlie", "0.0.0.0"]
