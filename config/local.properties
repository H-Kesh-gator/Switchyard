# Local demo: ./scripts/demo.sh
listen.bind=127.0.0.1
listen.port=8080
admin.bind=127.0.0.1
admin.port=9090

balance.algorithm=round_robin
backends=alpha,bravo,charlie
backend.alpha.url=http://127.0.0.1:9001
backend.alpha.weight=3
backend.bravo.url=http://127.0.0.1:9002
backend.bravo.weight=1
backend.charlie.url=http://127.0.0.1:9003
backend.charlie.weight=1

proxy.maxConcurrent=32
proxy.maxQueued=32
proxy.queueWaitMs=500
proxy.connectTimeoutMs=500
proxy.requestTimeoutMs=2000
proxy.maxRequestBytes=1048576
proxy.maxResponseBytes=4194304
# Maximum additional attempts; applies ONLY to bodyless GET/HEAD.
proxy.retries=1
health.path=/health
health.intervalMs=1000
health.timeoutMs=400
health.failures=2
health.successes=2
circuit.failures=3
circuit.openMs=3000
# Per socket-peer IP. Use 0 to disable the limiter when benchmarking throughput.
rate.perSecond=100
rate.burst=200
rate.maxClients=10000
shutdown.seconds=5
